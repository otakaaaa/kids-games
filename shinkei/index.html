<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="めくりっこ">
<meta name="theme-color" content="#fff6e8">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>めくりっこ しんけいすいじゃく</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; position:fixed;
    touch-action:manipulation; overscroll-behavior:none; background:#fff6e8;
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Rounded Mplus 1c",sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-text-size-adjust:100%;
    background-image:
      radial-gradient(circle at 10% 12%, #ffe9d0 0 20%, transparent 20.5%),
      radial-gradient(circle at 90% 86%, #ffeef6 0 22%, transparent 22.5%);
  }

  #app { display:flex; flex-direction:column; width:100%; height:100%;
         padding:max(8px, env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom)); }

  #bar { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 2px 8px; }
  .barbtn {
    font-family:inherit; font-weight:900; cursor:pointer; line-height:1; text-decoration:none;
    background:rgba(255,255,255,.92); border:3px solid #f0b978; border-radius:999px;
    color:#c07521; font-size:clamp(13px,3.4vw,19px); padding:0.5em 0.85em;
    display:inline-flex; align-items:center; gap:0.3em; white-space:nowrap;
  }
  .barbtn:active { background:#ffeed8; }
  #count {
    font-weight:900; color:#c07521; font-size:clamp(14px,3.8vw,22px);
    background:rgba(255,255,255,.92); border:3px solid #f0b978; border-radius:999px;
    padding:0.45em 0.9em; white-space:nowrap;
  }

  #board { flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; }
  #grid { display:grid; }

  .card { perspective:900px; cursor:pointer; }
  .inner {
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d; transition:transform .38s cubic-bezier(.4,1.4,.5,1);
  }
  .card.up .inner, .card.done .inner { transform:rotateY(180deg); }
  .face {
    position:absolute; inset:0; border-radius:16px; overflow:hidden;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border:4px solid #e8a55e; background:#fff;
  }
  .front { transform:rotateY(180deg); }
  .face canvas { width:100%; height:100%; display:block; }
  .card.done { animation:pop .45s ease; }
  .card.done .face { border-color:#7fd0a8; box-shadow:0 0 0 4px rgba(127,208,168,.4); }
  @keyframes pop { 0%{transform:scale(1)} 45%{transform:scale(1.14)} 100%{transform:scale(1)} }

  .screen {
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3.5vh; text-align:center;
    background:rgba(255,246,232,.96); padding:20px;
  }
  .screen.hidden { display:none; }
  .title { font-size:clamp(26px,7.5vw,52px); color:#d9822b; font-weight:900;
           text-shadow:0 3px 0 #fff, 0 5px 10px rgba(217,130,43,.22); line-height:1.4; }
  .sub { font-size:clamp(14px,3.8vw,22px); color:#b3701f; }
  .bigbtn {
    font-family:inherit; font-weight:900; border:none; cursor:pointer; text-decoration:none;
    font-size:clamp(20px,5.6vw,36px); color:#fff;
    background:linear-gradient(#ffbe63,#f59a22);
    padding:0.5em 1.3em; border-radius:999px;
    box-shadow:0 7px 0 #c87b12, 0 10px 20px rgba(200,123,18,.3);
    display:inline-flex; align-items:center; gap:0.3em;
  }
  .bigbtn:active { transform:translateY(5px); box-shadow:0 2px 0 #c87b12; }
  .bigbtn.g { background:linear-gradient(#9fe3c0,#4fc08d); box-shadow:0 7px 0 #2f9a68, 0 10px 20px rgba(47,154,104,.3); }
  .row { display:flex; gap:3vw; flex-wrap:wrap; justify-content:center; }
  .lvl { display:flex; flex-direction:column; gap:4px; align-items:center; }
  .lvl .n { font-size:1.5em; }
  #winCanvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
</style>
</head>
<body>

<div id="app">
  <div id="bar">
    <a class="barbtn" href="../">🏠 おうち</a>
    <div id="count">0 / 0</div>
    <button class="barbtn" id="againBtn">🔄 もういちど</button>
  </div>
  <div id="board"><div id="grid"></div></div>
</div>

<div id="startScreen" class="screen">
  <div class="title">めくりっこ</div>
  <div class="sub">おなじ えを さがしてね</div>
  <div class="row" id="levels"></div>
</div>

<div id="winScreen" class="screen hidden">
  <canvas id="winCanvas"></canvas>
  <div class="title" id="winTitle">ぜんぶ そろったね！</div>
  <div class="sub" id="winSub"></div>
  <div class="row">
    <button class="bigbtn" id="winAgain">🔄 もういちど</button>
    <button class="bigbtn g" id="winLevel">まいすうを かえる</button>
  </div>
  <a class="bigbtn g" href="../" style="background:linear-gradient(#ffe07a,#f5bb2a);box-shadow:0 7px 0 #cf9508;color:#7a5600;">🏠 おうち</a>
</div>

<script>
(function () {
  "use strict";

  const LINE = "#c08a5e", CREAM = "#fffaf6", PINK = "#ffabd4", PINK_L = "#ffd9ea",
        MINT = "#a9e5d2", MINT_D = "#6ec6ab", FUR = "#f3ece4";

  /* ============ きほんの かたち ============ */
  function flower(g, x, y, r, petal, center) {
    g.save(); g.translate(x, y); g.fillStyle = petal;
    for (let i = 0; i < 5; i++) {
      g.save(); g.rotate((i / 5) * Math.PI * 2);
      g.beginPath(); g.ellipse(0, -r * 0.62, r * 0.42, r * 0.62, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }
    g.fillStyle = center; g.beginPath(); g.arc(0, 0, r * 0.36, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  function bow(g, x, y, r, col, ln, rot) {
    g.save(); g.translate(x, y); g.rotate(rot || 0);
    g.fillStyle = col; g.strokeStyle = ln; g.lineWidth = 2.6; g.lineJoin = "round";
    g.beginPath(); g.ellipse(-r * .95, 0, r * .82, r * .6, -.34, 0, Math.PI * 2); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(r * .95, 0, r * .82, r * .6, .34, 0, Math.PI * 2); g.fill(); g.stroke();
    g.beginPath(); g.arc(0, 0, r * .4, 0, Math.PI * 2); g.fill(); g.stroke();
    g.restore();
  }
  function star(g, x, y, r, col, ln) {
    g.save(); g.translate(x, y); g.fillStyle = col; g.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * .44 : r, a = (i / 10) * Math.PI * 2 - Math.PI / 2;
      i ? g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath(); g.fill();
    if (ln) { g.strokeStyle = ln; g.lineWidth = 3; g.lineJoin = "round"; g.stroke(); }
    g.restore();
  }

  /* ============ カードの え（100x100 の なかに えがく） ============ */
  const FACES = [
    { bg: "#ffeaf4", d: g => {   // ももちゃん
        g.lineJoin = "round"; g.lineCap = "round";
        for (const dir of [-1, 1]) {
          g.save(); g.translate(50 + dir * 13, 42); g.rotate(dir * 0.3);
          g.fillStyle = CREAM; g.strokeStyle = LINE; g.lineWidth = 2.6;
          g.beginPath(); g.ellipse(0, -25, 8.4, 27, 0, 0, Math.PI * 2); g.fill(); g.stroke();
          g.fillStyle = PINK_L; g.beginPath(); g.ellipse(0, -25, 4, 20, 0, 0, Math.PI * 2); g.fill();
          g.restore();
        }
        g.fillStyle = CREAM; g.strokeStyle = LINE; g.lineWidth = 2.6;
        g.beginPath(); g.ellipse(50, 55, 25, 23, 0, 0, Math.PI * 2); g.fill(); g.stroke();
        g.fillStyle = PINK; g.beginPath();
        g.moveTo(24, 42); g.bezierCurveTo(21, 20, 35, 8, 50, 8);
        g.bezierCurveTo(65, 8, 79, 20, 76, 42);
        for (let i = 0; i < 6; i++) g.arc(76 - i * (52 / 6) - (52 / 12), 42, 52 / 12, 0, Math.PI, false);
        g.closePath(); g.fill(); g.stroke();
        flower(g, 71, 28, 8, "#ffe066", "#fff8dc");
        bow(g, 27, 12, 6.5, MINT, MINT_D, -0.2);
        for (const dx of [-9.5, 9.5]) {
          g.fillStyle = "#5a3d33";
          g.beginPath(); g.ellipse(50 + dx, 54, 4.2, 5.6, 0, 0, Math.PI * 2); g.fill();
          g.fillStyle = "#fff"; g.beginPath(); g.arc(50 + dx + 1.5, 52, 1.8, 0, Math.PI * 2); g.fill();
        }
        g.fillStyle = "rgba(255,150,190,.45)";
        g.beginPath(); g.ellipse(32, 63, 5, 3.2, 0, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.ellipse(68, 63, 5, 3.2, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#ff9ec2"; g.beginPath(); g.ellipse(50, 61, 2.2, 1.6, 0, 0, Math.PI * 2); g.fill();
        g.strokeStyle = "#c98a6e"; g.lineWidth = 1.9;
        g.beginPath(); g.arc(50, 63, 5, .12 * Math.PI, .88 * Math.PI); g.stroke();
      } },
    { bg: "#e6f7f0", d: g => {   // ねねちゃん
        g.lineJoin = "round"; g.lineCap = "round";
        for (const dir of [-1, 1]) {
          g.fillStyle = FUR; g.strokeStyle = LINE; g.lineWidth = 2.6;
          g.beginPath();
          g.moveTo(50 + dir * 8, 34); g.lineTo(50 + dir * 21, 15); g.lineTo(50 + dir * 25, 39);
          g.closePath(); g.fill(); g.stroke();
          g.fillStyle = PINK_L; g.beginPath();
          g.moveTo(50 + dir * 11.5, 34); g.lineTo(50 + dir * 19, 21); g.lineTo(50 + dir * 21, 36);
          g.closePath(); g.fill();
        }
        g.fillStyle = FUR; g.strokeStyle = LINE; g.lineWidth = 2.6;
        g.beginPath(); g.ellipse(50, 55, 26, 24, 0, 0, Math.PI * 2); g.fill(); g.stroke();
        g.strokeStyle = "rgba(192,138,94,.75)"; g.lineWidth = 1.6;
        for (const dir of [-1, 1]) for (let i = 0; i < 3; i++) {
          const y = 53 + i * 4.5;
          g.beginPath(); g.moveTo(50 + dir * 18, y); g.lineTo(50 + dir * 34, y - 3 + i * 3); g.stroke();
        }
        for (const dx of [-10, 10]) {
          g.fillStyle = "#4f3a30";
          g.beginPath(); g.ellipse(50 + dx, 52, 4.4, 5.8, 0, 0, Math.PI * 2); g.fill();
          g.fillStyle = "#fff"; g.beginPath(); g.arc(50 + dx + 1.6, 50, 1.9, 0, Math.PI * 2); g.fill();
        }
        g.fillStyle = "rgba(255,150,190,.42)";
        g.beginPath(); g.ellipse(31, 63, 5, 3.2, 0, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.ellipse(69, 63, 5, 3.2, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#ff9ec2"; g.beginPath();
        g.moveTo(47, 60); g.lineTo(53, 60); g.lineTo(50, 63); g.closePath(); g.fill();
        g.strokeStyle = "#c98a6e"; g.lineWidth = 1.9;
        g.beginPath(); g.arc(47, 65, 3, .05 * Math.PI, .95 * Math.PI); g.stroke();
        g.beginPath(); g.arc(53, 65, 3, .05 * Math.PI, .95 * Math.PI); g.stroke();
        bow(g, 50, 22, 9, MINT, MINT_D, -0.15);
      } },
    { bg: "#fff2f7", d: g => {   // おはな
        g.strokeStyle = "#7cc45f"; g.lineWidth = 5; g.lineCap = "round";
        g.beginPath(); g.moveTo(50, 52); g.lineTo(50, 86); g.stroke();
        g.fillStyle = "#8fd06f";
        g.beginPath(); g.ellipse(36, 70, 12, 6, -0.5, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.ellipse(64, 78, 11, 5.5, 0.5, 0, Math.PI * 2); g.fill();
        flower(g, 50, 40, 30, "#ff8fc0", "#fff8dc");
      } },
    { bg: "#fff6e0", d: g => {   // ケーキ
        g.fillStyle = "#ffd9a0"; g.strokeStyle = LINE; g.lineWidth = 3; g.lineJoin = "round";
        g.beginPath(); g.roundRect(22, 52, 56, 30, 6); g.fill(); g.stroke();
        g.fillStyle = "#fff";
        g.beginPath(); g.moveTo(22, 54);
        g.bezierCurveTo(30, 66, 38, 66, 45, 54);
        g.bezierCurveTo(52, 66, 60, 66, 67, 54);
        g.bezierCurveTo(72, 62, 76, 60, 78, 54);
        g.lineTo(78, 44); g.lineTo(22, 44); g.closePath(); g.fill();
        g.strokeStyle = LINE; g.lineWidth = 3; g.stroke();
        g.fillStyle = "#ff7a9e";
        [32, 50, 68].forEach(x => { g.beginPath(); g.arc(x, 47, 5, 0, Math.PI * 2); g.fill(); });
        g.strokeStyle = "#f5a3c0"; g.lineWidth = 4; g.lineCap = "round";
        g.beginPath(); g.moveTo(50, 42); g.lineTo(50, 26); g.stroke();
        g.fillStyle = "#ffd45c"; g.strokeStyle = LINE; g.lineWidth = 2.4;
        g.beginPath(); g.ellipse(50, 20, 5.5, 8, 0, 0, Math.PI * 2); g.fill(); g.stroke();
      } },
    { bg: "#f1ecff", d: g => {   // ちょうちょ
        g.fillStyle = "#c9b0f0"; g.strokeStyle = "#8b6fd0"; g.lineWidth = 3; g.lineJoin = "round";
        for (const dir of [-1, 1]) {
          g.beginPath(); g.ellipse(50 + dir * 22, 38, 20, 17, dir * 0.4, 0, Math.PI * 2); g.fill(); g.stroke();
          g.beginPath(); g.ellipse(50 + dir * 18, 66, 15, 13, -dir * 0.35, 0, Math.PI * 2); g.fill(); g.stroke();
        }
        g.fillStyle = "#fff5b8";
        for (const dir of [-1, 1]) {
          g.beginPath(); g.arc(50 + dir * 24, 36, 5.5, 0, Math.PI * 2); g.fill();
          g.beginPath(); g.arc(50 + dir * 18, 66, 4, 0, Math.PI * 2); g.fill();
        }
        g.fillStyle = "#6b4fa8"; g.strokeStyle = "#6b4fa8"; g.lineWidth = 3; g.lineCap = "round";
        g.beginPath(); g.ellipse(50, 52, 5, 22, 0, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.moveTo(48, 32); g.quadraticCurveTo(40, 20, 34, 20); g.stroke();
        g.beginPath(); g.moveTo(52, 32); g.quadraticCurveTo(60, 20, 66, 20); g.stroke();
      } },
    { bg: "#fffbe0", d: g => star(g, 50, 50, 38, "#ffd45c", "#e0a71b") },
    { bg: "#eaf6ff", d: g => {   // にじ
        const cols = ["#ff9ec2", "#ffd166", "#9ee0a8", "#8fc8f5", "#c9b0f0"];
        for (let i = 0; i < 5; i++) {
          g.strokeStyle = cols[i]; g.lineWidth = 11;
          g.beginPath(); g.arc(50, 84, 44 - i * 11, Math.PI, 0); g.stroke();
        }
        g.fillStyle = "#fff";
        [[20, 76], [80, 76]].forEach(c => {
          g.beginPath();
          g.arc(c[0] - 8, c[1], 8, 0, Math.PI * 2); g.arc(c[0], c[1] - 4, 11, 0, Math.PI * 2);
          g.arc(c[0] + 9, c[1] + 1, 7, 0, Math.PI * 2); g.fill();
        });
      } },
    { bg: "#ffeef0", d: g => {   // いちご
        g.fillStyle = "#ff6b81"; g.strokeStyle = "#d63a52"; g.lineWidth = 3; g.lineJoin = "round";
        g.beginPath(); g.moveTo(50, 88);
        g.bezierCurveTo(22, 72, 20, 40, 50, 36);
        g.bezierCurveTo(80, 40, 78, 72, 50, 88);
        g.closePath(); g.fill(); g.stroke();
        g.fillStyle = "#fff3b0";
        for (let i = 0; i < 9; i++) {
          const x = 34 + (i % 3) * 16, y = 50 + Math.floor(i / 3) * 12;
          g.save(); g.translate(x + (Math.floor(i / 3) % 2 ? 4 : 0), y); g.rotate(0.3);
          g.beginPath(); g.ellipse(0, 0, 2.6, 4, 0, 0, Math.PI * 2); g.fill(); g.restore();
        }
        g.fillStyle = "#57bb63"; g.strokeStyle = "#2f8a3f"; g.lineWidth = 2.6;
        g.beginPath();
        g.moveTo(50, 40); g.lineTo(28, 30); g.lineTo(44, 28); g.lineTo(36, 16);
        g.lineTo(50, 26); g.lineTo(64, 16); g.lineTo(56, 28); g.lineTo(72, 30);
        g.closePath(); g.fill(); g.stroke();
      } }
  ];

  function drawBack(g) {
    const gr = g.createLinearGradient(0, 0, 0, 100);
    gr.addColorStop(0, "#ffc98a"); gr.addColorStop(1, "#f5a45c");
    g.fillStyle = gr; g.fillRect(0, 0, 100, 100);
    g.fillStyle = "rgba(255,255,255,.35)";
    for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) {
      if ((x + y) % 2) continue;
      flower(g, 10 + x * 20, 10 + y * 20, 7, "rgba(255,255,255,.5)", "rgba(255,255,255,.75)");
    }
    g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 5;
    g.strokeRect(6, 6, 88, 88);
  }

  function mkCanvas(px, painter, bg) {
    const c = document.createElement("canvas");
    c.width = px; c.height = px;
    const g = c.getContext("2d");
    g.scale(px / 100, px / 100);
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, 100, 100); }
    painter(g);
    return c;
  }

  /* ============ ゲーム ============ */
  const gridEl = document.getElementById("grid"), boardEl = document.getElementById("board"),
        countEl = document.getElementById("count");
  let cards = [], first = null, lock = false, found = 0, total = 0, level = 8;

  try { const v = parseInt(localStorage.getItem("shinkei_level") || "8", 10); if ([4, 8, 12].includes(v)) level = v; } catch (e) {}

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function start(n) {
    level = n; total = n / 2; found = 0; first = null; lock = false;
    try { localStorage.setItem("shinkei_level", String(n)); } catch (e) {}

    const kinds = shuffle(FACES.map((_, i) => i)).slice(0, total);
    const deck = shuffle(kinds.concat(kinds));

    gridEl.innerHTML = "";
    cards = deck.map((k, i) => {
      const el = document.createElement("div");
      el.className = "card";
      const inner = document.createElement("div"); inner.className = "inner";
      const back = document.createElement("div"); back.className = "face back";
      back.appendChild(mkCanvas(200, drawBack, null));
      const front = document.createElement("div"); front.className = "face front";
      front.appendChild(mkCanvas(200, FACES[k].d, FACES[k].bg));
      inner.appendChild(back); inner.appendChild(front);
      el.appendChild(inner);
      const card = { el, kind: k, done: false };
      el.addEventListener("click", () => tap(card));
      gridEl.appendChild(el);
      return card;
    });
    layout(); updateCount();
  }

  function updateCount() { countEl.textContent = found + " / " + total; }

  function tap(c) {
    if (lock || c.done || c === first) return;
    initAudio();
    if (c.el.classList.contains("up")) return;
    c.el.classList.add("up");
    beep(660, 0.16);

    if (!first) { first = c; return; }

    if (first.kind === c.kind) {
      const a = first; first = null; lock = true;
      setTimeout(() => {
        a.done = c.done = true;
        a.el.classList.add("done"); c.el.classList.add("done");
        found++; updateCount();
        [784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.24), i * 90));
        lock = false;
        if (found === total) setTimeout(win, 650);
      }, 320);
    } else {
      const a = first; first = null; lock = true;
      beep(300, 0.18);
      setTimeout(() => {
        a.el.classList.remove("up"); c.el.classList.remove("up");
        lock = false;
      }, 950);
    }
  }

  function layout() {
    const W = boardEl.clientWidth, H = boardEl.clientHeight;
    if (!W || !H || !cards.length) return;
    const land = W > H, n = cards.length;
    const cols = n === 4 ? 2 : n === 8 ? (land ? 4 : 2) : (land ? 4 : 3);
    const rows = Math.ceil(n / cols);
    const gap = Math.max(6, Math.min(W, H) * 0.022);
    const size = Math.floor(Math.min((W - gap * (cols - 1)) / cols, (H - gap * (rows - 1)) / rows));
    gridEl.style.gridTemplateColumns = "repeat(" + cols + ", " + size + "px)";
    gridEl.style.gridAutoRows = size + "px";
    gridEl.style.gap = gap + "px";
  }
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", () => setTimeout(layout, 200));
  if (window.ResizeObserver) new ResizeObserver(layout).observe(boardEl);

  /* ============ がめん ============ */
  const startScreen = document.getElementById("startScreen"),
        winScreen = document.getElementById("winScreen"),
        levelsEl = document.getElementById("levels");

  [[4, "🐣", "やさしい"], [8, "🐰", "ふつう"], [12, "🦊", "むずかしい"]].forEach(l => {
    const b = document.createElement("button");
    b.className = "bigbtn"; b.innerHTML = '<span class="lvl"><span class="n">' + l[1] + "</span>" + l[0] + "まい</span>";
    b.addEventListener("click", () => {
      initAudio(); startScreen.classList.add("hidden"); winScreen.classList.add("hidden");
      start(l[0]); beep(880, 0.2);
    });
    levelsEl.appendChild(b);
  });

  document.getElementById("againBtn").addEventListener("click", () => { winScreen.classList.add("hidden"); start(level); });
  document.getElementById("winAgain").addEventListener("click", () => { winScreen.classList.add("hidden"); start(level); });
  document.getElementById("winLevel").addEventListener("click", () => { winScreen.classList.add("hidden"); startScreen.classList.remove("hidden"); });

  /* ============ クリア えんしゅつ ============ */
  const wc = document.getElementById("winCanvas"), wg = wc.getContext("2d");
  let confetti = [], winOn = false;
  const PRAISE = ["すごい！", "やったね！", "だいせいこう！", "てんさい！", "かんぺき！"];

  function win() {
    document.getElementById("winTitle").textContent = PRAISE[Math.floor(Math.random() * PRAISE.length)];
    document.getElementById("winSub").textContent = "ぜんぶ そろったね（" + total + "くみ）";
    winScreen.classList.remove("hidden");
    wc.width = wc.clientWidth; wc.height = wc.clientHeight;
    confetti = [];
    const cols = ["#ff8fc0", "#ffd166", "#a0e7a0", "#a6c8ff", "#e0a6ff", "#ffb3a0"];
    for (let i = 0; i < 70; i++) confetti.push({
      x: Math.random() * wc.width, y: -Math.random() * wc.height,
      vy: 1.2 + Math.random() * 2.2, vx: (Math.random() - .5) * 1.2,
      r: 4 + Math.random() * 7, a: Math.random() * Math.PI, va: (Math.random() - .5) * .12,
      c: cols[i % cols.length]
    });
    [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.4), i * 110));
    if (!winOn) { winOn = true; requestAnimationFrame(confLoop); }
  }
  function confLoop() {
    if (winScreen.classList.contains("hidden")) { winOn = false; wg.clearRect(0, 0, wc.width, wc.height); return; }
    wg.clearRect(0, 0, wc.width, wc.height);
    for (const p of confetti) {
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      if (p.y > wc.height + 20) { p.y = -20; p.x = Math.random() * wc.width; }
      wg.save(); wg.translate(p.x, p.y); wg.rotate(p.a);
      wg.fillStyle = p.c; wg.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.5); wg.restore();
    }
    requestAnimationFrame(confLoop);
  }

  /* ============ おと ============ */
  let ac = null;
  function initAudio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === "suspended") ac.resume();
  }
  function beep(f, d) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0, ac.currentTime);
    g.gain.linearRampToValueAtTime(0.14, ac.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + (d || 0.2));
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + (d || 0.2) + 0.05);
  }
})();
</script>
