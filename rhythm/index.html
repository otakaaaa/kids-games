<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="リズム">
<meta name="theme-color" content="#fff0e6">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>のりのりリズム</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; position:fixed;
    touch-action:none; overscroll-behavior:none; background:#fff0e6;
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Rounded Mplus 1c",sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-text-size-adjust:100%;
  }
  #app { display:flex; flex-direction:column; width:100%; height:100%;
         padding:max(8px, env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom)); }

  #bar { flex:0 0 auto; display:flex; align-items:center; gap:5px; padding-bottom:6px; }
  .btn {
    flex:0 1 auto; min-width:0; overflow:hidden; white-space:nowrap;
    font-family:inherit; font-weight:900; cursor:pointer; line-height:1; text-decoration:none;
    background:#fff; border:3px solid #f0a878; border-radius:999px;
    color:#c0621f; font-size:clamp(11px,3vw,17px); padding:0.5em 0.75em;
    display:inline-flex; align-items:center; gap:0.25em;
  }
  .btn:active { background:#ffe6d4; }
  .btn.on { background:linear-gradient(#ffab74,#f07c30); border-color:#c0621f; color:#fff; }
  #bar .sp { flex:1 1 auto; }
  @media (max-width:430px) { .btn .lb { display:none; } .btn { padding:0.5em 0.62em; } }

  #songbar { flex:0 0 auto; display:flex; gap:6px; align-items:center; padding-bottom:6px; }
  .song {
    flex:1 1 0; min-width:0; overflow:hidden; white-space:nowrap;
    font-family:inherit; font-weight:900; cursor:pointer; font-size:clamp(11px,3vw,17px);
    background:#fff; border:3px solid #ffc46b; border-radius:999px; color:#c07d18;
    padding:0.45em 0.4em; text-align:center;
  }
  .song.on { background:linear-gradient(#ffd07a,#f5a72a); border-color:#c07d18; color:#fff; }

  #prog { flex:0 0 auto; height:12px; background:#fff; border:3px solid #f0a878;
          border-radius:999px; overflow:hidden; margin-bottom:6px; }
  #progIn { height:100%; width:0%; background:linear-gradient(90deg,#ffd07a,#f07c30); }

  #play { flex:1 1 auto; min-height:0; position:relative; }
  #pc { position:absolute; inset:0; width:100%; height:100%; }

  #drum {
    flex:0 0 auto; height:clamp(96px,24vh,190px); border-radius:26px; cursor:pointer;
    background:linear-gradient(#ff9a5c,#ef6f22); border:6px solid #b4541a;
    box-shadow:0 8px 0 #93430f; display:flex; align-items:center; justify-content:center;
    transition:transform .06s, box-shadow .06s; margin-top:6px;
  }
  #drum .inner {
    width:56%; aspect-ratio:1/1; max-height:76%; border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #fff6ea, #ffd9b8);
    border:6px solid #b4541a; display:flex; align-items:center; justify-content:center;
    font-size:clamp(18px,5.5vw,36px); font-weight:900; color:#c0621f;
  }
  #drum.hit { transform:translateY(7px) scale(.985); box-shadow:0 1px 0 #93430f; }

  #free { flex:1 1 auto; min-height:0; display:grid; gap:8px; grid-template-columns:repeat(3,1fr); }
  .pad {
    border-radius:26px; cursor:pointer; border:6px solid rgba(0,0,0,.15);
    box-shadow:0 7px 0 rgba(0,0,0,.18); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px; transition:transform .06s, box-shadow .06s;
  }
  .pad .e { font-size:clamp(30px,11vw,80px); line-height:1; }
  .pad .n { font-size:clamp(12px,3.4vw,22px); font-weight:900; color:rgba(0,0,0,.5); }
  .pad.hit { transform:translateY(6px); box-shadow:0 1px 0 rgba(0,0,0,.18); }

  .hide { display:none !important; }

  .screen {
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2.4vh; text-align:center;
    background:rgba(255,240,230,.96); padding:20px;
  }
  .screen.hidden { display:none; }
  .title { font-size:clamp(24px,7vw,50px); color:#c0621f; font-weight:900;
           text-shadow:0 3px 0 #fff, 0 5px 10px rgba(192,98,31,.2); line-height:1.35; }
  .sub { font-size:clamp(14px,3.8vw,22px); color:#a9622b; line-height:1.6; }
  #stars { font-size:clamp(38px,12vw,86px); line-height:1; letter-spacing:6px; }
  #resCount { font-size:clamp(26px,8vw,54px); font-weight:900; color:#e07a12; }
  .bigbtn {
    font-family:inherit; font-weight:900; border:none; cursor:pointer; text-decoration:none;
    font-size:clamp(19px,5.2vw,34px); color:#fff;
    background:linear-gradient(#ffab74,#f07c30);
    padding:0.5em 1.2em; border-radius:999px;
    box-shadow:0 7px 0 #b4541a, 0 10px 20px rgba(180,84,26,.3);
    display:inline-flex; align-items:center; gap:0.3em;
  }
  .bigbtn:active { transform:translateY(5px); box-shadow:0 2px 0 #b4541a; }
  .bigbtn.g { background:linear-gradient(#9fe3c0,#4fc08d); box-shadow:0 7px 0 #2f9a68; }
  .row { display:flex; gap:3vw; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>

<div id="app">
  <div id="bar">
    <a class="btn" href="../">🏠</a>
    <button class="btn on" id="mSong">🎵<span class="lb"> おんがく</span></button>
    <button class="btn" id="mFree">✋<span class="lb"> じゆうに</span></button>
    <span class="sp"></span>
    <span class="btn" id="comboTag" style="cursor:default">0 かい</span>
  </div>

  <div id="songbar"><div id="songs" style="display:flex;gap:6px;flex:1 1 auto"></div></div>
  <div id="prog"><div id="progIn"></div></div>

  <div id="play"><canvas id="pc"></canvas></div>
  <div id="drum"><div class="inner" id="drumLabel">タップ</div></div>

  <div id="free" class="hide"></div>
</div>

<div id="startScreen" class="screen">
  <div class="title">のりのりリズム</div>
  <div class="sub">おんがくに あわせて<br>まるが かさなったら タップ！</div>
  <button class="bigbtn" id="startBtn">▶️ はじめる</button>
</div>

<div id="resScreen" class="screen hidden">
  <div class="title" id="resTitle">じょうず！</div>
  <div id="stars">⭐️⭐️⭐️</div>
  <div id="resCount">0 / 0</div>
  <div class="sub" id="resSub"></div>
  <div class="row">
    <button class="bigbtn" id="againBtn">🔄 もういちど</button>
    <button class="bigbtn g" id="nextBtn">▶️ つぎのきょく</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const FONT = '"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN",sans-serif';

  /* ============ おと の どうぐ ============ */
  let ac = null, noiseBuf = null, master = null;
  function initAudio() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
      if (ac) {
        master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
    }
    if (ac && ac.state === "suspended") ac.resume();
  }
  const T = () => (ac ? ac.currentTime : 0);

  function noise(when, dur, hp, vol) {
    if (!ac) return;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(when); s.stop(when + dur + 0.05);
  }
  function kick(when, vol) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(165, when);
    o.frequency.exponentialRampToValueAtTime(48, when + 0.16);
    g.gain.setValueAtTime(vol || 0.5, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.3);
    o.connect(g); g.connect(master);
    o.start(when); o.stop(when + 0.35);
  }
  function snare(when) { noise(when, 0.13, 1600, 0.26); }
  function hat(when, acc) { noise(when, acc ? 0.05 : 0.028, 7000, acc ? 0.1 : 0.055); }
  function bass(when, semi) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle"; o.frequency.value = 130.81 * Math.pow(2, semi / 12);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(0.24, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.36);
    o.connect(g); g.connect(master);
    o.start(when); o.stop(when + 0.4);
  }
  function lead(when, semi) {
    if (!ac) return;
    const f = 261.63 * Math.pow(2, semi / 12);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(0.17, when + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.55);
    g.connect(master);
    const o1 = ac.createOscillator(); o1.type = "sine"; o1.frequency.value = f; o1.connect(g);
    const o2 = ac.createOscillator(); o2.type = "sine"; o2.frequency.value = f * 4.01;
    const g2 = ac.createGain(); g2.gain.setValueAtTime(0.2, when);
    g2.gain.exponentialRampToValueAtTime(0.0001, when + 0.16);
    o2.connect(g2); g2.connect(g);
    o1.start(when); o2.start(when); o1.stop(when + 0.6); o2.stop(when + 0.6);
  }
  function don(when, vol) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(200, when);
    o.frequency.exponentialRampToValueAtTime(70, when + 0.14);
    g.gain.setValueAtTime(vol || 0.45, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.26);
    o.connect(g); g.connect(master);
    o.start(when); o.stop(when + 0.3);
    noise(when, 0.06, 1200, 0.12);
  }
  function bell(when) { noise(when, 0.45, 4200, 0.2); }
  function clap(when) { noise(when, 0.15, 1400, 0.36); }
  function tick(when, strong) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "square"; o.frequency.value = strong ? 1500 : 1050;
    g.gain.setValueAtTime(strong ? 0.12 : 0.07, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.05);
    o.connect(g); g.connect(master); o.start(when); o.stop(when + 0.07);
  }

  /* ============ きょく ============ */
  // ─────────────────────────────────────────────────────────────
  //  メロディ の かきかた： [8ぶおんぷの いち, おんてい]
  //    おんてい： ド=0 レ=2 ミ=4 ファ=5 ソ=7 ラ=9 シ=11 ド'=12
  //    いち：    1しょうせつ = 8スロット。0,2,4,6 が 4ぶおんぷ
  //    root：    しょうせつ ごとの ベース音（C=0 F=5 G=7 Am=9）
  //  おとが ちがう ところが あったら ここの すうじ を なおせば OK
  // ─────────────────────────────────────────────────────────────
  const BARS = 8, SPB = 8, COUNTIN = 8;

  const SONGS = [
    { name: "むすんで", full: "むすんでひらいて", bpm: 88,
      mel: [[0, 7], [2, 7], [4, 7], [6, 4], [8, 7], [10, 9], [12, 7],
            [16, 4], [18, 4], [20, 2], [22, 0], [24, 2], [26, 4], [28, 2],
            [32, 7], [34, 7], [36, 7], [38, 4], [40, 7], [42, 9], [44, 7],
            [48, 4], [50, 7], [52, 4], [54, 2], [56, 0]],
      root: [0, 0, 7, 0, 0, 0, 7, 0] },

    { name: "おおきなくり", full: "おおきなくりのきのしたで", bpm: 104,
      mel: [[0, 7], [2, 7], [4, 9], [6, 7], [8, 4], [10, 4], [12, 0],
            [16, 2], [18, 2], [20, 4], [22, 2], [24, 0],
            [32, 7], [34, 7], [36, 9], [38, 7], [40, 4], [42, 4], [44, 0],
            [48, 2], [50, 4], [52, 2], [54, 0], [56, 0]],
      root: [0, 0, 7, 0, 0, 0, 7, 0] },

    { name: "あたまかた", full: "あたま かた ひざ ポン", bpm: 112,
      mel: [[0, 7], [2, 7], [4, 7], [6, 4], [8, 4], [10, 4], [12, 7],
            [16, 7], [18, 7], [20, 7], [22, 4], [24, 4], [26, 4], [28, 0],
            [32, 7], [34, 9], [36, 7], [38, 5], [40, 4], [42, 2], [44, 0],
            [48, 2], [50, 4], [52, 5], [54, 4], [56, 0]],
      root: [0, 0, 7, 0, 0, 7, 7, 0] }
  ];
  let songIdx = 0;

  let events = [], cues = [], slotDur = 0, songLen = 0, TOL = 0.25;

  function buildSong() {
    const S = SONGS[songIdx];
    slotDur = 30 / S.bpm;                    // 8ぶおんぷ の びょうすう
    events = []; cues = [];

    // カウントイン（4はく）
    for (let i = 0; i < 4; i++) events.push({ t: i * 2 * slotDur, k: "tick", a: i === 0 });

    const off = COUNTIN * slotDur;
    for (let b = 0; b < BARS; b++) {
      const bt = off + b * SPB * slotDur;
      for (let s = 0; s < SPB; s++) {
        const t = bt + s * slotDur;
        events.push({ k: "hat", t: t, a: s % 4 === 0 });
        if (s === 0 || s === 4) { events.push({ k: "kick", t: t }); events.push({ k: "bass", t: t, v: S.root[b] }); }
        if (s === 2 || s === 6) events.push({ k: "snare", t: t });
      }
    }
    S.mel.forEach(m => events.push({ k: "lead", t: off + m[0] * slotDur, v: m[1] }));

    // タップ の あいず は「うた の おと」と おなじ いち。
    // うたいながら たたける ので 手あそび歌 らしく なる
    S.mel.forEach(m => cues.push({ t: off + m[0] * slotDur, done: 0 }));
    cues.sort((a, b) => a.t - b.t);

    events.sort((a, b) => a.t - b.t);
    songLen = off + BARS * SPB * slotDur;

    // となりあう あいず の あいだ より せまく して、となりと まちがえない ように する
    let minGap = 99;
    for (let i = 1; i < cues.length; i++) minGap = Math.min(minGap, cues[i].t - cues[i - 1].t);
    TOL = Math.min(0.26, minGap * 0.45);
  }

  function playEv(e) {
    const w = songStart + e.t;
    if (e.k === "hat") hat(w, e.a);
    else if (e.k === "kick") kick(w, 0.5);
    else if (e.k === "snare") snare(w);
    else if (e.k === "bass") bass(w, e.v);
    else if (e.k === "lead") lead(w, e.v);
    else if (e.k === "tick") tick(w, e.a);
  }

  /* ============ ゲーム じょうたい ============ */
  let songStart = 0, evIdx = 0, sched = null, running = false;
  let hits = 0, combo = 0, best = 0, pops = [], parts = [];
  const APPROACH = 1.7;                        // なんびょう まえ から ながれてくるか

  const playEl = document.getElementById("play"), pc = document.getElementById("pc"), pg = pc.getContext("2d");
  const progIn = document.getElementById("progIn"), comboTag = document.getElementById("comboTag");
  const drumEl = document.getElementById("drum"), drumLabel = document.getElementById("drumLabel");
  let dpr = 1;

  function pcResize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    pc.width = Math.floor(playEl.clientWidth * dpr);
    pc.height = Math.floor(playEl.clientHeight * dpr);
    pg.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function startSong() {
    initAudio(); if (!ac) return;
    buildSong();
    hits = 0; combo = 0; best = 0; pops = []; parts = [];
    evIdx = 0; songStart = T() + 1.0; running = true;
    drumLabel.textContent = "タップ";
    comboTag.textContent = "0 かい";
    if (sched) clearInterval(sched);
    sched = setInterval(scheduler, 25);
  }

  function scheduler() {
    if (!running) return;
    const ahead = T() + 0.15;
    while (evIdx < events.length && songStart + events[evIdx].t < ahead) { playEv(events[evIdx]); evIdx++; }
    // きょく が おわるまで とまらない。まちがえても さいごまで ながれる
    if (T() > songStart + songLen + 0.9) { finish(); }
  }

  function finish() {
    running = false;
    if (sched) { clearInterval(sched); sched = null; }
    const total = cues.length;
    const rate = total ? hits / total : 0;
    const stars = rate >= 0.85 ? 3 : rate >= 0.6 ? 2 : 1;
    document.getElementById("stars").textContent = "⭐️".repeat(stars) + "・".repeat(3 - stars);
    document.getElementById("resCount").textContent = hits + " / " + total + " かい";
    document.getElementById("resTitle").textContent =
      stars === 3 ? ["かんぺき！", "のりのり！", "てんさい！"][Math.floor(Math.random() * 3)]
      : stars === 2 ? ["いいね！", "じょうず！"][Math.floor(Math.random() * 2)]
      : "さいごまで できたね！";
    document.getElementById("resSub").textContent =
      "「" + SONGS[songIdx].full + "」\nいちばん つづいたのは " + best + " かい";
    document.getElementById("resSub").style.whiteSpace = "pre-line";
    document.getElementById("resScreen").classList.remove("hidden");
    const sc = [523, 659, 784, 1047, 1319];
    for (let i = 0; i < stars + 2; i++) setTimeout(() => { if (ac) lead(T(), [0, 4, 7, 12, 16][Math.min(i, 4)]); }, i * 130);
  }

  function tap() {
    initAudio();
    drumEl.classList.add("hit");
    setTimeout(() => drumEl.classList.remove("hit"), 90);
    if (!running) { don(T(), 0.5); return; }
    const now = T() - songStart;
    let bi = -1, bd = TOL;
    cues.forEach((c, i) => {
      if (c.done) return;
      const d = Math.abs(c.t - now);
      if (d <= bd) { bd = d; bi = i; }
    });
    if (bi >= 0) {
      cues[bi].done = 1;
      hits++; combo++; best = Math.max(best, combo);
      comboTag.textContent = combo + " かい";
      don(T(), 0.55); bell(T());
      pops.push({ t: performance.now(), txt: combo >= 5 ? "のりのり！" : "いいね！" });
      burst();
    } else {
      combo = 0; comboTag.textContent = "0 かい";
      don(T(), 0.45);            // おとは なる。ペナルティ なし
    }
  }
  drumEl.addEventListener("pointerdown", e => { e.preventDefault(); tap(); });
  playEl.addEventListener("pointerdown", e => { e.preventDefault(); tap(); });

  function burst() {
    const W = playEl.clientWidth, H = playEl.clientHeight;
    const x = W * 0.22, y = H * 0.56;
    for (let i = 0; i < 10; i++) parts.push({
      x: x, y: y, vx: (Math.random() - .5) * 5, vy: -1.5 - Math.random() * 4,
      life: 1, c: ["#ffd45c", "#ff9ec9", "#8fd6bc", "#8fb6f8"][i % 4], s: 5 + Math.random() * 6
    });
  }

  /* ============ ももちゃん ============ */
  function drawMomo(g, cx, cy, s, tt, hit) {
    g.save(); g.translate(cx, cy);
    g.rotate(Math.sin(tt / 500) * 0.05 + hit * 0.1);
    g.scale(s / 100, (s / 100) * (1 + hit * 0.09));
    const LINE = "#c08a5e", PINK = "#ffabd4", PINK_L = "#ffd9ea", CREAM = "#fffaf6",
          MINT = "#a9e5d2", MINT_D = "#6ec6ab";
    g.lineJoin = "round"; g.lineCap = "round";
    [-1, 1].forEach(dir => {
      g.save(); g.translate(dir * 15, -20); g.rotate(dir * (0.30 + hit * 0.22));
      g.fillStyle = CREAM; g.strokeStyle = LINE; g.lineWidth = 3;
      g.beginPath(); g.ellipse(0, -30, 10, 34, 0, 0, Math.PI * 2); g.fill(); g.stroke();
      g.fillStyle = PINK_L; g.beginPath(); g.ellipse(0, -30, 5, 25, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    });
    g.fillStyle = CREAM; g.strokeStyle = LINE; g.lineWidth = 3;
    g.beginPath(); g.ellipse(0, 0, 29, 27, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = PINK; g.strokeStyle = LINE;
    g.beginPath(); g.moveTo(-31, -16); g.bezierCurveTo(-35, -42, -19, -58, 0, -58);
    g.bezierCurveTo(19, -58, 35, -42, 31, -16);
    const N = 6, sw = 62 / N, sr = sw / 2;
    for (let i = 0; i < N; i++) g.arc(31 - i * sw - sr, -16, sr, 0, Math.PI, false);
    g.closePath(); g.fill(); g.stroke();
    g.save(); g.translate(25, -32); g.scale(0.5, 0.5);
    g.fillStyle = "#ffe066";
    for (let i = 0; i < 5; i++) { g.save(); g.rotate((i / 5) * Math.PI * 2); g.beginPath(); g.ellipse(0, -7, 4.6, 7, 0, 0, Math.PI * 2); g.fill(); g.restore(); }
    g.fillStyle = "#fff8dc"; g.beginPath(); g.arc(0, 0, 4, 0, Math.PI * 2); g.fill();
    g.restore();
    g.save(); g.translate(-30, -66); g.rotate(-0.18);
    g.fillStyle = MINT; g.strokeStyle = MINT_D; g.lineWidth = 2.4;
    g.beginPath(); g.ellipse(-7.6, 0, 6.6, 4.8, -0.34, 0, Math.PI * 2); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(7.6, 0, 6.6, 4.8, 0.34, 0, Math.PI * 2); g.fill(); g.stroke();
    g.beginPath(); g.arc(0, 0, 3.2, 0, Math.PI * 2); g.fill(); g.stroke();
    g.restore();
    const blink = (tt % 4200 < 150) ? 0.1 : 1;
    [-11, 11].forEach(dx => {
      g.save(); g.translate(dx, -2); g.scale(1, blink);
      if (hit > 0.35) {
        g.strokeStyle = "#5a3d33"; g.lineWidth = 2.6;
        g.beginPath(); g.arc(0, 2, 5, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
      } else {
        g.fillStyle = "#5a3d33"; g.beginPath(); g.ellipse(0, 0, 4.8, 6.4, 0, 0, Math.PI * 2); g.fill();
        if (blink > .5) { g.fillStyle = "#fff"; g.beginPath(); g.arc(1.7, -2.2, 2.1, 0, Math.PI * 2); g.fill(); }
      }
      g.restore();
    });
    g.fillStyle = "rgba(255,150,190,.45)";
    g.beginPath(); g.ellipse(-21, 12, 5.5, 3.5, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(21, 12, 5.5, 3.5, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#ff9ec2"; g.beginPath(); g.ellipse(0, 8, 2.4, 1.8, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "#c98a6e"; g.lineWidth = 2;
    g.beginPath(); g.arc(0, 10, 5.5 + hit * 2, 0.12 * Math.PI, 0.88 * Math.PI); g.stroke();
    g.restore();
  }

  /* ============ びょうが ============ */
  (function loop() {
    const W = playEl.clientWidth, H = playEl.clientHeight;
    pg.clearRect(0, 0, pc.width, pc.height);
    if (W && H) {
      const tx = W * 0.22, ty = H * 0.56, R = Math.min(W, H) * 0.105;
      const now = running ? (T() - songStart) : -99;

      // レーン
      pg.fillStyle = "rgba(255,255,255,.62)";
      pg.beginPath(); pg.roundRect(0, ty - R * 1.35, W, R * 2.7, R * 1.35); pg.fill();

      // まと
      pg.strokeStyle = "#e07a12"; pg.lineWidth = Math.max(4, R * 0.16);
      pg.beginPath(); pg.arc(tx, ty, R, 0, Math.PI * 2); pg.stroke();
      pg.strokeStyle = "rgba(224,122,18,.28)"; pg.lineWidth = Math.max(2, R * 0.1);
      pg.beginPath(); pg.arc(tx, ty, R * 1.35, 0, Math.PI * 2); pg.stroke();

      // ながれてくる まる
      if (running) {
        const lane = W - tx - R;
        for (const c of cues) {
          const dt = c.t - now;
          if (dt > APPROACH || dt < -0.55) continue;
          const x = tx + (dt / APPROACH) * lane;
          if (c.done) {
            const a = Math.max(0, 1 + dt / 0.4);
            pg.globalAlpha = a; pg.fillStyle = "#7fd0a8";
            pg.beginPath(); pg.arc(tx, ty, R * (1 + (1 - a) * 0.7), 0, Math.PI * 2); pg.fill();
            pg.globalAlpha = 1;
          } else {
            const miss = dt < -TOL;
            pg.globalAlpha = miss ? Math.max(0, 1 + (dt + TOL) / 0.4) * 0.45 : 1;
            pg.fillStyle = miss ? "#c9c2bb" : "#ffb03c";
            pg.strokeStyle = miss ? "#a89f97" : "#e07a12";
            pg.lineWidth = Math.max(3, R * 0.14);
            pg.beginPath(); pg.arc(x, ty, R * 0.82, 0, Math.PI * 2); pg.fill(); pg.stroke();
            pg.fillStyle = "#fff"; pg.textAlign = "center"; pg.textBaseline = "middle";
            pg.font = "900 " + (R * 0.85) + "px sans-serif";
            pg.fillText("♪", x, ty + R * 0.04);
            pg.globalAlpha = 1;
          }
        }
        progIn.style.width = Math.max(0, Math.min(100, now / songLen * 100)) + "%";
      }

      // ももちゃん（はく に あわせて はねる）
      let bounce = 0;
      if (running && now > 0) {
        const beat = slotDur * 2;
        const ph = (now % beat) / beat;
        bounce = Math.max(0, 1 - ph * 5);
      }
      const ms = Math.min(W * 0.2, H * 0.42);
      drawMomo(pg, W * 0.22, ty - Math.min(W, H) * 0.3 - bounce * ms * 0.08, ms, performance.now(), bounce);

      // ほめことば
      const nowMs = performance.now();
      pops = pops.filter(p => nowMs - p.t < 800);
      pg.textAlign = "center"; pg.textBaseline = "middle";
      for (const p of pops) {
        const a = 1 - (nowMs - p.t) / 800;
        pg.globalAlpha = a;
        pg.font = "900 " + (Math.min(W, H) * 0.075) + "px " + FONT;
        pg.lineWidth = Math.min(W, H) * 0.016; pg.strokeStyle = "#fff"; pg.lineJoin = "round";
        pg.strokeText(p.txt, W * 0.22, ty - R * 1.9 - (1 - a) * 30);
        pg.fillStyle = "#e07a12";
        pg.fillText(p.txt, W * 0.22, ty - R * 1.9 - (1 - a) * 30);
        pg.globalAlpha = 1;
      }
      // きらきら
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.life -= 0.024;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        pg.globalAlpha = Math.max(0, p.life); pg.fillStyle = p.c;
        pg.beginPath(); pg.arc(p.x, p.y, p.s, 0, Math.PI * 2); pg.fill();
      }
      pg.globalAlpha = 1;
    }
    requestAnimationFrame(loop);
  })();

  /* ============ きょく えらび ============ */
  const songsEl = document.getElementById("songs");
  SONGS.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "song" + (i === 0 ? " on" : "");
    b.textContent = s.name; b.title = s.full;
    b.addEventListener("click", () => {
      songIdx = i;
      [...songsEl.children].forEach((x, j) => x.classList.toggle("on", j === i));
      document.getElementById("resScreen").classList.add("hidden");
      startSong();
    });
    songsEl.appendChild(b);
  });

  /* ============ じゆうに たたく ============ */
  const freeEl = document.getElementById("free");
  [["🥁", "たいこ", "#ff9a5c", () => don(T(), 0.6)],
   ["🔔", "すず", "#ffd45c", () => bell(T())],
   ["👏", "てびょうし", "#9ede84", () => clap(T())]].forEach(p => {
    const d = document.createElement("div");
    d.className = "pad"; d.style.background = p[2];
    d.innerHTML = '<div class="e">' + p[0] + '</div><div class="n">' + p[1] + "</div>";
    d.addEventListener("pointerdown", e => { e.preventDefault(); initAudio(); p[3]();
      d.classList.add("hit"); setTimeout(() => d.classList.remove("hit"), 90); });
    freeEl.appendChild(d);
  });

  /* ============ モード ============ */
  const mSong = document.getElementById("mSong"), mFree = document.getElementById("mFree");
  const songbar = document.getElementById("songbar"), prog = document.getElementById("prog");
  function stopAll() {
    running = false;
    if (sched) { clearInterval(sched); sched = null; }
  }
  mSong.addEventListener("click", () => {
    mSong.classList.add("on"); mFree.classList.remove("on");
    songbar.classList.remove("hide"); prog.classList.remove("hide");
    playEl.classList.remove("hide"); drumEl.classList.remove("hide"); freeEl.classList.add("hide");
    setTimeout(pcResize, 0);
  });
  mFree.addEventListener("click", () => {
    initAudio(); stopAll();
    mFree.classList.add("on"); mSong.classList.remove("on");
    songbar.classList.add("hide"); prog.classList.add("hide");
    playEl.classList.add("hide"); drumEl.classList.add("hide"); freeEl.classList.remove("hide");
  });

  document.getElementById("startBtn").addEventListener("click", () => {
    initAudio();
    document.getElementById("startScreen").classList.add("hidden");
    pcResize(); startSong();
  });
  document.getElementById("againBtn").addEventListener("click", () => {
    document.getElementById("resScreen").classList.add("hidden"); startSong();
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    songIdx = (songIdx + 1) % SONGS.length;
    [...songsEl.children].forEach((x, j) => x.classList.toggle("on", j === songIdx));
    document.getElementById("resScreen").classList.add("hidden"); startSong();
  });

  window.addEventListener("resize", pcResize);
  window.addEventListener("orientationchange", () => setTimeout(pcResize, 200));
  if (window.ResizeObserver) new ResizeObserver(pcResize).observe(playEl);
  document.addEventListener("visibilitychange", () => { if (document.hidden) stopAll(); });

  pcResize();
})();
</script>
</body>
</html>
