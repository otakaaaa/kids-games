<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="きせかえ">
<meta name="theme-color" content="#eaf7f2">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>ねねちゃんの きせかえ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; position:fixed;
    touch-action:manipulation; overscroll-behavior:none; background:#eaf7f2;
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Rounded Mplus 1c",sans-serif;
    user-select:none; -webkit-user-select:none; -webkit-text-size-adjust:100%;
  }
  #app { display:flex; flex-direction:column; width:100%; height:100%; }

  #stageWrap { position:relative; flex:1 1 auto; min-height:0; }
  #stage { display:block; width:100%; height:100%; }

  /* iOS の ちいさい がめん でも りょうたん が きれない ように */
  #homeBtn { left:max(10px, env(safe-area-inset-left)); }
  #randBtn { right:max(10px, env(safe-area-inset-right)); }

  .topbtn {
    position:absolute; top:max(10px, env(safe-area-inset-top)); z-index:5;
    font-family:inherit; font-weight:900; cursor:pointer; line-height:1;
    background:rgba(255,255,255,.9); border:3px solid #8fd6bc; border-radius:999px;
    color:#2e8f70; font-size:clamp(14px,3.6vw,20px); padding:0.55em 0.9em;
    display:flex; align-items:center; gap:0.35em; text-decoration:none;
  }
  .topbtn:active { background:#d8f2e8; }
  #homeBtn { left:10px; }
  #randBtn { right:10px; background:linear-gradient(#ffe07a,#f5bb2a); border-color:#cf9508; color:#7a5600; }

  #panel {
    flex:0 1 auto; min-height:0; max-height:56%;
    display:flex; flex-direction:column;
    background:#fff; border-top:5px solid #8fd6bc;
    border-radius:26px 26px 0 0;
    padding:10px max(8px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 18px rgba(46,143,112,.12);
  }

  #tabs { display:flex; gap:5px; margin-bottom:8px; flex:0 0 auto; }
  .tab {
    /* min-width:0 が ないと ちぢまずに はみだして きれる */
    flex:1 1 0; min-width:0; overflow:hidden; white-space:nowrap;
    font-family:inherit; font-weight:900; cursor:pointer;
    font-size:clamp(10px,2.9vw,17px); color:#5f9c88; line-height:1.2;
    background:#eefaf5; border:3px solid #cbeade; border-radius:16px;
    padding:0.4em 0.15em; display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .tab .i { font-size:1.4em; line-height:1; }
  .tab.on { background:linear-gradient(#7fdcbc,#43bd97); border-color:#2e8f70; color:#fff; }

  #items {
    flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(clamp(58px,14vw,86px),1fr));
    gap:7px; padding:2px; align-content:start;
  }

  /* よこむき・せの ひくい がめん */
  @media (orientation:landscape) and (max-height:560px) {
    #panel { max-height:50%; }
    .tab { flex-direction:row; gap:5px; padding:0.35em 0.2em; }
    .tab .i { font-size:1.15em; }
  }
  /* とても せまい がめん */
  @media (max-width:340px) {
    .tab { font-size:10px; }
    .tab .i { font-size:1.25em; }
  }
  .sw {
    border:4px solid #d9ece5; border-radius:16px; background:#f7fdfb; padding:3px;
    cursor:pointer; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center;
    transition:transform .1s;
  }
  .sw canvas { width:100%; height:100%; display:block; }
  .sw.on { border-color:#2e8f70; background:#d9f5ec; transform:scale(1.06); }
</style>
</head>
<body>

<div id="app">
  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <a id="homeBtn" class="topbtn" href="../">🏠 おうち</a>
    <button id="randBtn" class="topbtn">🎲 おまかせ</button>
  </div>

  <div id="panel">
    <div id="tabs"></div>
    <div id="items"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============ いろ ============ */
  const LINE = "#c08a5e", CREAM = "#fffaf6", PINK = "#ffabd4", PINK_L = "#ffd9ea",
        MINT = "#a9e5d2", MINT_D = "#6ec6ab", LEMON = "#ffe066", SKY = "#a8d5f5",
        LILAC = "#c9b0f0", PEACH = "#ffb999", GOLD = "#f5c542", GOLD_D = "#c9971f",
        WHITE = "#ffffff", FUR = "#f3ece4", FUR_D = "#e2d6c9";

  function dk(hex, k) {            // いろを すこし こくする
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, ((n >> 16) & 255) * k | 0),
          g = Math.max(0, ((n >> 8) & 255) * k | 0),
          b = Math.max(0, (n & 255) * k | 0);
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  /* ============ きほん の かたち ============ */
  function flower(g, x, y, r, petal, center) {
    g.save(); g.translate(x, y);
    g.fillStyle = petal;
    for (let i = 0; i < 5; i++) {
      g.save(); g.rotate((i / 5) * Math.PI * 2);
      g.beginPath(); g.ellipse(0, -r * 0.62, r * 0.42, r * 0.62, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }
    g.fillStyle = center; g.beginPath(); g.arc(0, 0, r * 0.36, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  function bow(g, x, y, r, color, line, rot) {
    g.save(); g.translate(x, y); g.rotate(rot || 0);
    g.fillStyle = color; g.strokeStyle = line; g.lineWidth = 2.6; g.lineJoin = "round";
    g.beginPath(); g.ellipse(-r * 0.95, 0, r * 0.82, r * 0.6, -0.34, 0, Math.PI * 2); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(r * 0.95, 0, r * 0.82, r * 0.6, 0.34, 0, Math.PI * 2); g.fill(); g.stroke();
    g.beginPath(); g.arc(0, 0, r * 0.4, 0, Math.PI * 2); g.fill(); g.stroke();
    g.restore();
  }
  function star(g, x, y, r, color) {
    g.save(); g.translate(x, y); g.fillStyle = color; g.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.44 : r, a = (i / 10) * Math.PI * 2 - Math.PI / 2;
      i ? g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath(); g.fill(); g.restore();
  }

  /* ============ ねねちゃん（ねこ） ============ */
  // 100 たんい くうかん。かお の ちゅうしん は (0,-16)
  function drawNene(g, t) {
    g.lineJoin = "round"; g.lineCap = "round";

    // しっぽ
    g.strokeStyle = LINE; g.lineWidth = 13;
    g.beginPath(); g.moveTo(20, 40);
    g.bezierCurveTo(42, 44, 50, 22, 40, 12); g.stroke();
    g.strokeStyle = FUR; g.lineWidth = 9;
    g.beginPath(); g.moveTo(20, 40);
    g.bezierCurveTo(42, 44, 50, 22, 40, 12); g.stroke();

    // あし
    g.fillStyle = FUR; g.strokeStyle = LINE; g.lineWidth = 3;
    for (const dx of [-13, 13]) {
      g.beginPath(); g.ellipse(dx, 50, 10, 7.5, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    }
    // からだ
    g.beginPath(); g.ellipse(0, 28, 25, 24, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    // て
    for (const dx of [-23, 23]) {
      g.beginPath(); g.ellipse(dx, 32, 8, 9.5, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    }
  }

  function drawNeneHead(g, t) {
    // みみ
    g.fillStyle = FUR; g.strokeStyle = LINE; g.lineWidth = 3; g.lineJoin = "round";
    for (const dir of [-1, 1]) {
      g.beginPath();
      g.moveTo(dir * 9, -38); g.lineTo(dir * 24, -56); g.lineTo(dir * 28, -33);
      g.closePath(); g.fill(); g.stroke();
      g.fillStyle = PINK_L;
      g.beginPath();
      g.moveTo(dir * 13, -38); g.lineTo(dir * 22, -50); g.lineTo(dir * 24, -36);
      g.closePath(); g.fill();
      g.fillStyle = FUR;
    }
    // かお
    g.fillStyle = FUR; g.strokeStyle = LINE; g.lineWidth = 3;
    g.beginPath(); g.ellipse(0, -16, 29, 26, 0, 0, Math.PI * 2); g.fill(); g.stroke();

    // ひげ
    g.strokeStyle = "rgba(192,138,94,.75)"; g.lineWidth = 1.8; g.lineCap = "round";
    for (const dir of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        const y = -12 + i * 5;
        g.beginPath(); g.moveTo(dir * 20, y); g.lineTo(dir * 38, y - 4 + i * 3.5); g.stroke();
      }
    }
    // め
    const blink = (t % 4600 < 150) ? 0.10 : 1;
    for (const dx of [-11, 11]) {
      g.save(); g.translate(dx, -18); g.scale(1, blink);
      g.fillStyle = "#4f3a30";
      g.beginPath(); g.ellipse(0, 0, 5, 6.6, 0, 0, Math.PI * 2); g.fill();
      if (blink > 0.5) {
        g.fillStyle = "#fff";
        g.beginPath(); g.arc(1.8, -2.3, 2.2, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(-1.7, 2.5, 1.2, 0, Math.PI * 2); g.fill();
      }
      g.restore();
    }
    // ほっぺ
    g.fillStyle = "rgba(255,150,190,.42)";
    g.beginPath(); g.ellipse(-21, -5, 5.5, 3.5, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(21, -5, 5.5, 3.5, 0, 0, Math.PI * 2); g.fill();
    // はな と くち
    g.fillStyle = "#ff9ec2";
    g.beginPath();
    g.moveTo(-3.2, -8.5); g.lineTo(3.2, -8.5); g.lineTo(0, -5.2); g.closePath(); g.fill();
    g.strokeStyle = "#c98a6e"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, -5.2); g.lineTo(0, -3.4); g.stroke();
    g.beginPath(); g.arc(-3.4, -3.4, 3.4, 0.05 * Math.PI, 0.95 * Math.PI); g.stroke();
    g.beginPath(); g.arc(3.4, -3.4, 3.4, 0.05 * Math.PI, 0.95 * Math.PI); g.stroke();
  }

  /* ============ アイテム ============ */
  // back:true は からだ より うしろに えがく
  const HATS = [
    { id: "none", none: true },
    { id: "bowP", d: g => bow(g, 0, -50, 13, PINK, dk(PINK, .78), -0.1) },
    { id: "bowM", d: g => bow(g, 0, -50, 13, MINT, MINT_D, -0.1) },
    { id: "bowL", d: g => bow(g, 0, -50, 13, LEMON, dk(LEMON, .78), -0.1) },
    { id: "straw", d: g => {
        g.fillStyle = "#f0cf8a"; g.strokeStyle = LINE; g.lineWidth = 3; g.lineJoin = "round";
        g.beginPath(); g.ellipse(0, -40, 38, 10, 0, 0, Math.PI * 2); g.fill(); g.stroke();
        g.beginPath(); g.ellipse(0, -49, 21, 15, 0, Math.PI, 0); g.fill(); g.stroke();
        g.fillStyle = PINK; g.beginPath(); g.roundRect(-21, -44, 42, 6, 3); g.fill();
      } },
    { id: "knitS", d: g => knit(g, SKY) },
    { id: "knitP", d: g => knit(g, PINK) },
    { id: "crown", d: g => {
        g.fillStyle = GOLD; g.strokeStyle = GOLD_D; g.lineWidth = 3; g.lineJoin = "round";
        g.beginPath();
        g.moveTo(-22, -38); g.lineTo(-22, -58); g.lineTo(-11, -48); g.lineTo(0, -62);
        g.lineTo(11, -48); g.lineTo(22, -58); g.lineTo(22, -38);
        g.closePath(); g.fill(); g.stroke();
        g.fillStyle = "#ff7ab5";
        [-13, 0, 13].forEach(x => { g.beginPath(); g.arc(x, -42, 3.4, 0, Math.PI * 2); g.fill(); });
      } },
    { id: "fcrown", d: g => {
        const cols = [PINK, LEMON, MINT, SKY, LILAC];
        for (let i = 0; i < 5; i++) {
          const a = -Math.PI * 0.82 + (i / 4) * Math.PI * 0.64;
          flower(g, Math.cos(a) * 30, -20 + Math.sin(a) * 26, 8.5, cols[i], "#fff8dc");
        }
      } }
  ];
  function knit(g, col) {
    g.fillStyle = col; g.strokeStyle = LINE; g.lineWidth = 3; g.lineJoin = "round";
    g.beginPath(); g.ellipse(0, -38, 30, 24, 0, Math.PI, 0); g.fill(); g.stroke();
    g.fillStyle = dk(col, .88);
    g.beginPath(); g.roundRect(-30, -42, 60, 9, 4); g.fill();
    g.strokeStyle = LINE; g.lineWidth = 2.6; g.stroke();
    g.fillStyle = WHITE; g.strokeStyle = LINE; g.lineWidth = 2.6;
    g.beginPath(); g.arc(0, -64, 8, 0, Math.PI * 2); g.fill(); g.stroke();
  }

  const WEARS = [
    { id: "none", none: true },
    { id: "dressP", d: g => dress(g, PINK) },
    { id: "dressM", d: g => dress(g, MINT) },
    { id: "dressL", d: g => dress(g, LILAC) },
    { id: "dressY", d: g => dress(g, LEMON) },
    { id: "hoodS", d: g => hoodie(g, SKY) },
    { id: "hoodP", d: g => hoodie(g, PEACH) },
    { id: "apron", d: g => {
        g.fillStyle = WHITE; g.strokeStyle = LINE; g.lineWidth = 3; g.lineJoin = "round";
        g.beginPath(); g.moveTo(-15, 12); g.lineTo(15, 12); g.lineTo(19, 48); g.lineTo(-19, 48);
        g.closePath(); g.fill(); g.stroke();
        g.beginPath(); g.moveTo(-11, 12); g.lineTo(-6, 3); g.moveTo(11, 12); g.lineTo(6, 3); g.stroke();
        g.fillStyle = PINK_L; g.beginPath(); g.roundRect(-9, 26, 18, 12, 4); g.fill(); g.stroke();
      } },
    { id: "stripe", d: g => {
        g.save();
        g.beginPath(); g.ellipse(0, 28, 25, 24, 0, 0, Math.PI * 2); g.clip();
        g.fillStyle = "#fff"; g.fillRect(-30, 2, 60, 54);
        g.fillStyle = SKY;
        for (let y = 6; y < 56; y += 12) g.fillRect(-30, y, 60, 6);
        g.restore();
        g.strokeStyle = LINE; g.lineWidth = 3;
        g.beginPath(); g.ellipse(0, 28, 25, 24, 0, 0, Math.PI * 2); g.stroke();
      } },
    { id: "capeP", back: true, d: g => cape(g, PINK) },
    { id: "capeL", back: true, d: g => cape(g, LILAC) }
  ];
  function dress(g, col) {
    g.fillStyle = col; g.strokeStyle = LINE; g.lineWidth = 3; g.lineJoin = "round";
    g.beginPath();
    g.moveTo(-17, 8); g.lineTo(17, 8);
    g.bezierCurveTo(26, 26, 30, 40, 30, 50);
    g.lineTo(-30, 50);
    g.bezierCurveTo(-30, 40, -26, 26, -17, 8);
    g.closePath(); g.fill(); g.stroke();
    g.fillStyle = "rgba(255,255,255,.55)";
    g.beginPath(); g.roundRect(-19, 16, 38, 7, 3.5); g.fill();
    flower(g, 0, 34, 9, "#fff8dc", col);
  }
  function hoodie(g, col) {
    g.fillStyle = col; g.strokeStyle = LINE; g.lineWidth = 3; g.lineJoin = "round";
    g.beginPath(); g.ellipse(0, 30, 27, 23, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = dk(col, .9);
    g.beginPath(); g.roundRect(-13, 32, 26, 11, 5); g.fill();
    g.strokeStyle = LINE; g.lineWidth = 2.4; g.stroke();
    g.strokeStyle = "#fff"; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-5, 10); g.lineTo(-5, 20); g.moveTo(5, 10); g.lineTo(5, 20); g.stroke();
  }
  function cape(g, col) {
    g.fillStyle = col; g.strokeStyle = LINE; g.lineWidth = 3; g.lineJoin = "round";
    g.beginPath();
    g.moveTo(-16, 8); g.lineTo(16, 8);
    g.bezierCurveTo(38, 28, 42, 46, 40, 56);
    g.bezierCurveTo(14, 50, -14, 50, -40, 56);
    g.bezierCurveTo(-42, 46, -38, 28, -16, 8);
    g.closePath(); g.fill(); g.stroke();
  }

  const ACCS = [
    { id: "none", none: true },
    { id: "bell", d: g => {
        g.strokeStyle = "#e0518c"; g.lineWidth = 6; g.lineCap = "round";
        g.beginPath(); g.arc(0, 4, 19, 0.16 * Math.PI, 0.84 * Math.PI); g.stroke();
        g.fillStyle = GOLD; g.strokeStyle = GOLD_D; g.lineWidth = 2.6;
        g.beginPath(); g.arc(0, 24, 7, 0, Math.PI * 2); g.fill(); g.stroke();
        g.beginPath(); g.moveTo(-4, 25); g.lineTo(4, 25); g.stroke();
      } },
    { id: "scarfM", d: g => scarf(g, MINT) },
    { id: "scarfP", d: g => scarf(g, PEACH) },
    { id: "glass", d: g => {
        g.strokeStyle = "#7a5b46"; g.lineWidth = 3; g.fillStyle = "rgba(255,255,255,.4)";
        for (const dx of [-11, 11]) { g.beginPath(); g.arc(dx, -18, 9, 0, Math.PI * 2); g.fill(); g.stroke(); }
        g.beginPath(); g.moveTo(-2, -18); g.lineTo(2, -18); g.stroke();
        g.beginPath(); g.moveTo(-20, -20); g.lineTo(-28, -23); g.moveTo(20, -20); g.lineTo(28, -23); g.stroke();
      } },
    { id: "tieP", d: g => bow(g, 0, 12, 10, PINK, dk(PINK, .78), 0) },
    { id: "tieS", d: g => bow(g, 0, 12, 10, SKY, dk(SKY, .78), 0) },
    { id: "neck", d: g => {
        const cols = [PINK, LEMON, MINT, SKY, LILAC];
        for (let i = 0; i < 5; i++) {
          const a = 0.22 * Math.PI + (i / 4) * 0.56 * Math.PI;
          flower(g, Math.cos(a) * 21, 4 + Math.sin(a) * 19, 6.5, cols[i], "#fff8dc");
        }
      } }
  ];
  function scarf(g, col) {
    g.fillStyle = col; g.strokeStyle = LINE; g.lineWidth = 3; g.lineJoin = "round";
    g.beginPath(); g.roundRect(-19, 4, 38, 11, 5.5); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(6, 12); g.lineTo(19, 12); g.lineTo(15, 34); g.lineTo(3, 30);
    g.closePath(); g.fill(); g.stroke();
  }

  const BGS = [
    { id: "sky", d: (g, W, H) => {
        grad(g, W, H, "#bfe6ff", "#eaf7ff");
        clouds(g, W, H, "rgba(255,255,255,.9)");
      } },
    { id: "field", d: (g, W, H) => {
        grad(g, W, H, "#cfefff", "#f0fbff");
        clouds(g, W, H, "rgba(255,255,255,.85)");
        g.fillStyle = "#b6e59a";
        g.beginPath(); g.moveTo(0, H * 0.68);
        g.bezierCurveTo(W * 0.3, H * 0.62, W * 0.7, H * 0.73, W, H * 0.65);
        g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();
        const cols = ["#ff8fc0", "#ffd166", "#e0a6ff", "#fff"];
        for (let i = 0; i < 16; i++) {
          const x = ((i * 37) % 100) / 100 * W, y = H * (0.72 + ((i * 53) % 40) / 100 * 0.24);
          flower(g, x, y, Math.min(W, H) * 0.035, cols[i % 4], "#fff8dc");
        }
      } },
    { id: "night", d: (g, W, H) => {
        grad(g, W, H, "#3b3b7a", "#7b6bb5");
        g.fillStyle = "#fff3b0";
        g.beginPath(); g.arc(W * 0.82, H * 0.16, Math.min(W, H) * 0.09, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#5a5a9e";
        g.beginPath(); g.arc(W * 0.78, H * 0.13, Math.min(W, H) * 0.085, 0, Math.PI * 2); g.fill();
        for (let i = 0; i < 22; i++) {
          const x = ((i * 61) % 100) / 100 * W, y = ((i * 29) % 100) / 100 * H * 0.75;
          star(g, x, y, Math.min(W, H) * (0.012 + (i % 3) * 0.006), "#fff8dc");
        }
      } },
    { id: "rainbow", d: (g, W, H) => {
        grad(g, W, H, "#fff0f7", "#eafaff");
        const cols = ["#ffb3d5", "#ffd166", "#b7e8a0", "#a6c8ff", "#d8b4f8"];
        const cx = W / 2, cy = H * 1.02, r0 = Math.min(W, H) * 0.86;
        for (let i = 0; i < 5; i++) {
          g.strokeStyle = cols[i]; g.lineWidth = Math.min(W, H) * 0.075;
          g.beginPath(); g.arc(cx, cy, r0 - i * Math.min(W, H) * 0.075, Math.PI, 0); g.stroke();
        }
        clouds(g, W, H, "rgba(255,255,255,.95)");
      } },
    { id: "sea", d: (g, W, H) => {
        grad(g, W, H, "#a9e4ff", "#5fc6e8");
        g.fillStyle = "rgba(255,255,255,.55)";
        for (let i = 0; i < 5; i++) {
          const y = H * (0.5 + i * 0.1);
          g.beginPath(); g.moveTo(0, y);
          for (let x = 0; x <= W; x += W / 8) g.quadraticCurveTo(x + W / 16, y - H * 0.02, x + W / 8, y);
          g.lineTo(W, y + H * 0.02); g.lineTo(0, y + H * 0.02); g.closePath(); g.fill();
        }
      } },
    { id: "room", d: (g, W, H) => {
        grad(g, W, H, "#ffeede", "#ffd9c2");
        g.fillStyle = "#e8b98f"; g.fillRect(0, H * 0.72, W, H * 0.28);
        g.fillStyle = "#cfeeff"; g.strokeStyle = "#c08a5e"; g.lineWidth = Math.min(W, H) * 0.014;
        const wx = W * 0.12, wy = H * 0.14, ww = W * 0.28, wh = H * 0.3;
        g.beginPath(); g.roundRect(wx, wy, ww, wh, 10); g.fill(); g.stroke();
        g.beginPath(); g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh);
        g.moveTo(wx, wy + wh / 2); g.lineTo(wx + ww, wy + wh / 2); g.stroke();
      } }
  ];
  function grad(g, W, H, a, b) {
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, a); gr.addColorStop(1, b);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  function clouds(g, W, H, col) {
    g.fillStyle = col;
    const u = Math.min(W, H) * 0.05;
    [[0.18, 0.16, 1], [0.72, 0.1, 0.8], [0.5, 0.3, 0.6]].forEach(c => {
      g.save(); g.translate(W * c[0], H * c[1]); g.scale(c[2] * u * 0.05, c[2] * u * 0.05);
      g.beginPath();
      g.arc(-22, 0, 18, 0, Math.PI * 2); g.arc(0, -8, 24, 0, Math.PI * 2); g.arc(24, 2, 17, 0, Math.PI * 2);
      g.fill(); g.restore();
    });
  }

  const CATS = [
    { key: "hat",  label: "ぼうし",   icon: "👒", list: HATS },
    { key: "wear", label: "ふく",     icon: "👗", list: WEARS },
    { key: "acc",  label: "かざり",   icon: "🎀", list: ACCS },
    { key: "bg",   label: "はいけい", icon: "🌈", list: BGS }
  ];

  /* ============ いまの すがた ============ */
  const pick = { hat: 0, wear: 1, acc: 1, bg: 1 };
  try {
    const sv = JSON.parse(localStorage.getItem("nene_kisekae") || "null");
    if (sv) for (const k in pick) if (typeof sv[k] === "number") pick[k] = sv[k];
  } catch (e) {}
  function save() { try { localStorage.setItem("nene_kisekae", JSON.stringify(pick)); } catch (e) {} }

  /* ============ ぜんたい を えがく ============ */
  function drawScene(g, W, H, t, opt) {
    const o = opt || pick;
    // はいけい
    if (o.bg != null && BGS[o.bg]) BGS[o.bg].d(g, W, H);
    else { g.fillStyle = "#eaf7f2"; g.fillRect(0, 0, W, H); }

    // キャラ を まんなかに
    const u = Math.min(W / 108, H / 148);
    g.save();
    g.translate(W / 2, H / 2 + 8 * u);
    g.scale(u, u);
    g.rotate(Math.sin(t / 700) * 0.02);

    const wear = o.wear != null ? WEARS[o.wear] : null;
    if (wear && wear.back && !wear.none) wear.d(g);
    drawNene(g, t);
    if (wear && !wear.back && !wear.none) wear.d(g);
    drawNeneHead(g, t);
    if (o.acc != null && ACCS[o.acc] && !ACCS[o.acc].none) ACCS[o.acc].d(g);
    if (o.hat != null && HATS[o.hat] && !HATS[o.hat].none) HATS[o.hat].d(g);

    g.restore();
  }

  /* ============ がめん ============ */
  const cv = document.getElementById("stage"), ctx = cv.getContext("2d");
  const wrap = document.getElementById("stageWrap");
  let SW = 0, SH = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    SW = wrap.clientWidth; SH = wrap.clientHeight;
    cv.width = Math.floor(SW * dpr); cv.height = Math.floor(SH * dpr);
    cv.style.width = SW + "px"; cv.style.height = SH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(() => { resize(); buildItems(); }, 200));
  // パネルの たかさが かわった ときも キャンバスを あわせる
  if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);

  (function loop(t) { drawScene(ctx, SW, SH, t, null); requestAnimationFrame(loop); })(0);

  /* ============ したの パネル ============ */
  const tabsEl = document.getElementById("tabs"), itemsEl = document.getElementById("items");
  let curCat = 0;

  CATS.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === 0 ? " on" : "");
    b.innerHTML = '<span class="i">' + c.icon + "</span>" + c.label;
    b.addEventListener("click", () => {
      curCat = i;
      [...tabsEl.children].forEach((x, j) => x.classList.toggle("on", j === i));
      buildItems();
      beep(520 + i * 60);
    });
    tabsEl.appendChild(b);
  });

  function buildItems() {
    const cat = CATS[curCat];
    itemsEl.innerHTML = "";
    cat.list.forEach((item, i) => {
      const d = document.createElement("div");
      d.className = "sw" + (pick[cat.key] === i ? " on" : "");
      const c = document.createElement("canvas");
      const px = 168;
      c.width = px; c.height = px;
      drawPreview(c.getContext("2d"), px, cat.key, i);
      d.appendChild(c);
      d.addEventListener("click", () => {
        pick[cat.key] = i; save();
        [...itemsEl.children].forEach((x, j) => x.classList.toggle("on", j === i));
        beep(720);
      });
      itemsEl.appendChild(d);
    });
  }

  function drawPreview(g, px, key, idx) {
    if (key === "bg") {
      g.save(); g.beginPath(); g.roundRect(0, 0, px, px, 18); g.clip();
      BGS[idx].d(g, px, px); g.restore();
      return;
    }
    // ミニ ねねちゃん に その アイテムだけ きせる
    const o = { hat: null, wear: null, acc: null, bg: null };
    o[key] = idx;
    g.fillStyle = "#f7fdfb"; g.fillRect(0, 0, px, px);
    drawScene(g, px, px, 0, o);
  }

  /* ============ おまかせ ============ */
  document.getElementById("randBtn").addEventListener("click", () => {
    initAudio();
    CATS.forEach(c => { pick[c.key] = Math.floor(Math.random() * c.list.length); });
    // 「なし」ばかりだと さみしいので ふくは かならず きせる
    if (WEARS[pick.wear].none) pick.wear = 1 + Math.floor(Math.random() * (WEARS.length - 1));
    save(); buildItems();
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f), i * 90));
  });

  /* ============ おと ============ */
  let ac = null;
  function initAudio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === "suspended") ac.resume();
  }
  function beep(f) {
    initAudio(); if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0, ac.currentTime);
    g.gain.linearRampToValueAtTime(0.13, ac.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.26);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + 0.3);
  }

  /* ============ スタート ============ */
  resize(); buildItems();
})();
</script>
</body>
</html>
